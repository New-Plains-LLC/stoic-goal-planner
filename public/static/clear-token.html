<!DOCTYPE html>
<html>
<head>
    <title>Clear Google Calendar Token</title>
    <script>
        localStorage.removeItem('google_calendar_token');
        localStorage.removeItem('google_refresh_token');
        alert('All Google Calendar tokens have been cleared!\n\nYou can now close this page and go back to the app.');
    </script>
</head>
<body>
    <h1>Token Cleared</h1>
    <p>You can close this page now.</p>
</body>
</html>
